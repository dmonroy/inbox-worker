name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing. Keep only the newest per ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: nothing here needs to write to the repo.
permissions:
  contents: read

# Two jobs, split by cost. `check` is everything that runs on the default pool
# — lint, types, the unit suite, the build, the CLI smoke test — and is the
# feedback you actually wait on. `integration` boots workerd through miniflare
# and talks to real local D1 and R2; that is the slow half, and the fast half
# should no longer be stuck behind it.
#
# They run in parallel with no `needs` between them, deliberately. Gating
# integration on `check` would let a formatting nit hide a broken migration
# until the next round trip — the same failure mode `!cancelled()` prevents
# within a job, one level up.
#
# The price is a second checkout, setup-node and `npm ci`. That was not worth
# paying when the whole suite was ~1s of work against ~20s of setup. It is now
# that half of it needs a runtime started first.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` not `install` — installs exactly the lockfile, and fails if
      # package.json and the lockfile have drifted apart.
      - run: npm ci

      # From here every step runs even when an earlier one fails, so one push
      # reports every problem. Otherwise a formatting nit hides a broken test
      # and you find out on the next round trip. `npm ci` above is the
      # exception: nothing downstream of it means anything if it failed.

      # The same check the pre-commit hook runs. The hook is bypassable, so
      # this is where formatting and lint are actually enforced.
      - name: Format and lint
        run: npm run check

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # The `unit` vitest project only. The `platform` project is the
      # `integration` job below — see `vitest.config.ts` for the split.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm run test:unit

      # Typecheck runs with bundler resolution and does not care about import
      # extensions; Node ESM does. The first build of the CLI emitted
      # extensionless imports and the binary would not start, with every test
      # still green. Building is the only step that catches that.
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      # A build producing an unrunnable binary is not a build. Invoking it with
      # no arguments exercises module resolution and the entrypoint guard while
      # touching nothing external — no wrangler, no database.
      #
      # grep is the assertion, deliberately: if node dies on an unresolvable
      # import, the output has no usage line and this fails.
      #
      # Block scalar because the grep pattern contains ": ", which a plain
      # YAML scalar cannot.
      - name: The CLI starts
        if: ${{ !cancelled() }}
        run: |
          node ./dist/cli.js 2>&1 | grep -q '^Usage: inbox-worker migrate'

      # The same class of gap as the one above, one level out. Tests import by
      # relative path; consumers import by package name through the `exports`
      # map. Nothing in the suite exercises that map, so a renamed dist file or
      # a wrong entry point stays green here and breaks on first install.
      #
      # Packing and installing is the only check that resolves the way a
      # consumer does, which is why this is worth the ~15s rather than
      # asserting the files merely exist on disk.
      - name: The package resolves as a dependency
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          npm pack --silent
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          npm init -y >/dev/null
          npm install --no-save "$GITHUB_WORKSPACE"/inbox-worker-*.tgz
          node --input-type=module -e "
            await import('inbox-worker')
            await import('inbox-worker/testing')
          "

      # `demo/` is the first real consumer, and the only place the
      # consumer-facing API is exercised the way a consumer exercises it. The
      # step above proves the `exports` map resolves; it imports and stops. It
      # cannot catch a `Team()` signature that changed, a binding the README
      # still names wrongly, or an import workerd's bundler cannot follow but
      # node can.
      #
      # Every command here is offline: no account, no `wrangler login`, no
      # secrets, which is what makes it safe on pull requests. It must run
      # after `Build` — the demo resolves `dist/`, not `src/`, and npm links
      # the `inbox-worker` bin only if `dist/cli.js` exists at install time.
      #
      # The cost is one more `npm ci` (~40 packages, its own copy of workerd).
      # Paid because a demo that silently stops working is worse than no demo:
      # it is instructions we ship and nobody runs.
      - name: The demo still builds and migrates
        if: ${{ !cancelled() }}
        working-directory: demo
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run db:migrate:local
          npx wrangler deploy --dry-run

      # Installing from git is a different path from installing a tarball, and
      # it broke while the tarball check stayed green. npm runs `prepare` on a
      # git dependency and ships whatever that leaves behind — so a `prepare`
      # that did not build produced a package with no `dist/` and an `exports`
      # map pointing at nothing. The tarball check missed it only because the
      # Build step above had already left `dist/` lying around.
      #
      # Until there is a release, git is how anything actually consumes this.
      #
      # Last in the job, deliberately: it deletes `dist/` and lets `prepare`
      # rebuild it, so anything above that needs `dist/` — the CLI smoke test,
      # the tarball install, the demo — must already have run.
      #
      # Deleting `dist/` first is the whole point: it forces `prepare` to be
      # the thing that recreates it. Cloning `git+file://` from the CI checkout
      # would be a closer simulation but an unreliable one — git can refuse to
      # clone from the shallow repo `actions/checkout` leaves behind.
      - name: prepare builds, so a git install ships dist
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          rm -rf dist
          npm pack --silent
          # List once into a variable rather than piping into `grep -q`.
          # `grep -q` exits on its first match, tar gets EPIPE, and pipefail
          # turns that into a failed step even though the assertion passed.
          contents=$(tar -tzf inbox-worker-*.tgz)
          grep -qx 'package/dist/index.js' <<<"$contents"
          grep -qx 'package/dist/testing.js' <<<"$contents"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The `platform` vitest project: inside workerd, against the local D1 and
      # R2 that miniflare stands up from the bindings declared in
      # `vitest.config.ts`. Nothing here reaches Cloudflare, so the job needs
      # no account, no API token and no secrets — which is what keeps it safe
      # to run on pull requests under the same read-only token as everything
      # else.
      #
      # No `if: ${{ !cancelled() }}` — it is the only check in this job, so
      # there is nothing after it to protect, and running it on top of a failed
      # `npm ci` would just report the install failure a second time in a less
      # obvious form.
      - name: Integration tests
        run: npm run test:integration
