name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing. Keep only the newest per ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` not `install` — installs exactly the lockfile, and fails if
      # package.json and the lockfile have drifted apart.
      - run: npm ci

      # Every check runs even when an earlier one fails, so one push reports
      # every problem. Otherwise a formatting nit hides a broken test and you
      # find out on the next round trip.
      #
      # Separate jobs would also give that, but each would repeat checkout,
      # setup-node and `npm ci` — ~20s of setup against ~1s of actual work.
      # Worth revisiting once the suite needs miniflare and gets slow enough
      # that a fast lint job is genuinely useful feedback.

      # The same check the pre-commit hook runs. The hook is bypassable, so
      # this is where formatting and lint are actually enforced.
      - name: Format and lint
        run: npm run check

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test
